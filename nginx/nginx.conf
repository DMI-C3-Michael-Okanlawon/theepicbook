user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format json escape=json
      '{"time":"$time_iso8601","service":"reverse-proxy",'
      '"method":"$request_method","uri":"$uri",'
      '"status":$status,"duration":$request_time,'
      '"upstream_status":"$upstream_status"}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16k;

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"reverse-proxy"}';
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 308 https://epicbook-michael-c3-2026.eastus.cloudapp.azure.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name epicbook-michael-c3-2026.eastus.cloudapp.azure.com;

        ssl_certificate /etc/letsencrypt/live/epicbook/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/epicbook/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"reverse-proxy"}';
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}
