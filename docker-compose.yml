name: epicbook-capstone

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: "${MYSQL_IMAGE:-mysql:8.4}"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookstore
      MYSQL_USER: epicbook
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_ROOT_HOST: localhost
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - back-tier
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/db_password)"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --connect-timeout=3 --execute="SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging: *default-logging

  backend:
    build:
      context: ./backend
    image: epicbook-backend:capstone
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: bookstore
      DB_USER: epicbook
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}"
    secrets:
      - db_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    image: epicbook-frontend:capstone
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - front-tier
    logging: *default-logging

  reverse-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - front-tier
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

networks:
  front-tier:
    driver: bridge
  back-tier:
    driver: bridge
    internal: true

volumes:
  mysql-data:
    name: ${MYSQL_DATA_VOLUME:-epicbook-capstone_mysql-data}

secrets:
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
